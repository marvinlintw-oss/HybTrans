<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HybridTranscriber - 智慧語者分離與會議逐字稿系統</title>
    <!-- 內嵌高解析 SVG Favicon，徹底消除 favicon.ico 404 報錯並支援 GitHub Pages 靜態部署 -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='system-ui, sans-serif' font-weight='800' font-size='28'%3EHT%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 非 localhost 環境 (如 GitHub Pages) 自動啟用 coi-serviceworker 以支援 WebGPU / WASM SharedArrayBuffer
      if (
        window.location.hostname !== 'localhost' &&
        window.location.hostname !== '127.0.0.1' &&
        !window.crossOriginIsolated
      ) {
        const script = document.createElement('script');
        script.src = './coi-serviceworker.min.js';
        document.head.appendChild(script);
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
